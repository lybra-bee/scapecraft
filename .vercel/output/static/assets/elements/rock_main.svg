<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="100%" height="100%">
  <defs>
    <radialGradient id="rockHighlight" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="45%" stop-color="#4a5568"/>
      <stop offset="80%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </radialGradient>
    <linearGradient id="rockShadowSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="60%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#10141a"/>
    </linearGradient>
    <filter id="rockRoughness">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.25 0"/>
      <feComposite in="SourceGraphic" in2="noise" operator="arithmetic" k1="1" k2="0.8" k3="0" k4="0"/>
    </filter>
  </defs>

  <!-- Базовый контур камня Seiryu с прозрачным фоном -->
  <g filter="url(#rockRoughness)">
    <!-- Теневая грань -->
    <path d="M 180,20 L 260,85 L 340,240 L 390,480 L 370,550 L 210,550 L 195,360 L 180,20 Z" fill="url(#rockShadowSide)"/>
    <!-- Освещенная фактурная грань -->
    <path d="M 180,20 L 260,85 L 210,210 L 195,360 L 130,420 L 40,520 L 20,440 L 70,220 L 110,120 Z" fill="url(#rockHighlight)"/>
    <!-- Сколы и трещины -->
    <path d="M 210,210 L 270,260 L 240,380 L 195,360 Z" fill="#3b4454" opacity="0.9"/>
    <path d="M 130,420 L 195,360 L 210,550 L 110,550 Z" fill="#242c38" opacity="0.95"/>
  </g>

  <!-- Прожилки кварца и кальцита -->
  <path d="M 185,25 Q 230,130 205,215 T 255,390 Q 285,470 310,550" stroke="rgba(240, 245, 255, 0.65)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 235,90 Q 255,170 220,260 T 235,430" stroke="rgba(240, 245, 255, 0.45)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 105,170 Q 140,210 160,320" stroke="rgba(240, 245, 255, 0.35)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
</svg>
