<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="100%" height="100%">
  <defs>
    <linearGradient id="woodBark" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3d1e0d"/>
      <stop offset="45%" stop-color="#241208"/>
      <stop offset="85%" stop-color="#150a04"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>
    <radialGradient id="naturalMoss" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
  </defs>

  <!-- Основной изгиб ствола Iron Wood -->
  <path d="M 30,460 C 90,400 170,330 250,230 C 310,155 365,80 435,25 C 415,55 375,115 325,185 C 255,285 175,385 85,475 Z" fill="url(#woodBark)"/>
  
  <!-- Разветвления -->
  <path d="M 235,255 C 285,235 365,225 440,205 C 390,225 325,245 270,270 Z" fill="url(#woodBark)"/>
  <path d="M 305,170 C 355,140 420,110 475,80 C 430,110 375,150 325,185 Z" fill="url(#woodBark)"/>
  <path d="M 140,365 C 190,335 245,325 285,315 C 235,335 185,360 135,395 Z" fill="url(#woodBark)"/>

  <!-- Пушистый мох Fissidens на развилках -->
  <ellipse cx="250" cy="240" rx="20" ry="12" fill="url(#naturalMoss)" opacity="0.95"/>
  <ellipse cx="270" cy="230" rx="16" ry="10" fill="url(#naturalMoss)" opacity="0.95"/>
  <ellipse cx="310" cy="175" rx="15" ry="9" fill="url(#naturalMoss)" opacity="0.95"/>
  <ellipse cx="190" cy="315" rx="24" ry="14" fill="url(#naturalMoss)" opacity="0.95"/>
  <ellipse cx="170" cy="330" rx="18" ry="11" fill="url(#naturalMoss)" opacity="0.95"/>
</svg>
