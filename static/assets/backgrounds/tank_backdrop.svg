<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Плавный градиент фирменного светорассеивающего экрана ADA Light Screen -->
    <linearGradient id="lightScreenGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#40b5f5"/>
      <stop offset="30%" stop-color="#148cd2"/>
      <stop offset="70%" stop-color="#0a5486"/>
      <stop offset="100%" stop-color="#053050"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="10%" r="65%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="35%" stop-color="rgba(56, 189, 248, 0.22)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#lightScreenGrad)"/>
  <rect width="1200" height="700" fill="url(#topGlow)"/>
</svg>
